<!-- Container for the entire device type list page -->
<div class="container-fluid">
  <!-- Row for page header and borders -->
  <div class="row borders-btm">
    <!-- Empty column for spacing -->
    <div class="col"></div>
    <!-- Column for page title -->
    <div class="col">
      <h1 class="title">{{ categoryName }} Device Type List</h1>
    </div>
    <!-- Column for action buttons -->
    <div class="col">
      <div class="btns-group">
        <button
          type="button"
          class="download-btn"
          (click)="downloadAllDeviceTypes()"
          matTooltip="Download all {{ categoryName }} Device Types as XML"
        >
          <i class="bi bi-cloud-arrow-down-fill download-icon"></i>
        </button>
        <button
          type="button"
          class="download-btn"
          matTooltip="Upload Device Type XML File"
          data-bs-toggle="modal"
          data-bs-target="#uploadDeviceTypeModal"
        >
          <i class="bi bi-cloud-arrow-up-fill download-icon"></i>
        </button>
        <button class="back-btn" (click)="goBack()" matTooltip="Back">
          <i class="bi bi-arrow-return-left icon-size"></i>
        </button>
        <button
          class="create-btn"
          (click)="createDeviceType()"
          matTooltip="Create {{ categoryName }} Device Type"
        >
          <i class="bi bi-plus-circle-fill icon-size"></i>
        </button>
      </div>
    </div>
  </div>
  <!-- Row for loader -->
  <div class="row loader-row" *ngIf="showLoader">
    <app-loader></app-loader>
  </div>
  <!-- No Data row -->
  <div
    class="row loader-row"
    style="top: 45%; left: 47%"
    *ngIf="isNoDataVisible && !showLoader"
  >
    <span>No Rows to Show</span>
  </div>
  <!-- Row for ag-Grid table section -->
  <div class="grid-container" [class]="themeClass">
    <ag-grid-angular
      style="width: 100%; height: 100%"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [suppressRowClickSelection]="true"
      [rowSelection]="rowSelection"
      [rowData]="rowData"
      [class]="themeClass"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [paginationPageSizeSelector]="paginationPageSizeSelector"
      (gridReady)="onGridReady($event)"
      [tooltipShowDelay]="tooltipShowDelay"
      [animateRows]="true"
      [context]="this"
      [gridOptions]="gridOptions"
    >
    </ag-grid-angular>
  </div>
</div>
<!-- Upload Device Type XML Modal -->
<div
  class="modal fade"
  #uploadDeviceTypeModal
  id="uploadDeviceTypeModal"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="uploadDeviceTypeModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog custom-modal">
    <div class="modal-content">
      <form [formGroup]="uploadXMLForm" (ngSubmit)="uploadXMLSubmit()">
        <div class="modal-header modaltitle">
          <h1 class="modal-title custom-title" id="uploadDeviceTypeModalLabel">
            Upload Device Type XML File
          </h1>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
            (click)="resetUploadForm()"
          ></button>
        </div>
        <div class="modal-body">
          <div class="container mt-4">
            <div class="row mb-3">
              <label for="uploadfile" class="col-md-4 col-form-label"
                >Select the device type XML file<span
                  style="color: red; margin-left: 0.75em"
                  >*</span
                ></label
              >
              <div class="col-md-8">
                <input
                  class="form-control form-control-sm"
                  id="uploadfile"
                  type="file"
                  formControlName="uploadXml"
                  (change)="onFileChange($event)"
                />
                <div
                  *ngIf="
                    uploadFormSubmitted &&
                    uploadXMLForm.controls['uploadXml']?.errors
                  "
                  class="text-danger"
                >
                  <small
                    *ngIf="
                      uploadXMLForm.controls['uploadXml']?.errors?.['required']
                    "
                    >Please upload the device type xml file.</small
                  >
                </div>
                <small *ngIf="uploadFileError" class="errorupload">{{
                  uploadFileError
                }}</small>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="modal-btns"
            data-bs-dismiss="modal"
            (click)="resetUploadForm()"
          >
            Close
          </button>
          <button type="submit" class="modal-btns">Upload</button>
        </div>
      </form>
    </div>
  </div>
</div>
